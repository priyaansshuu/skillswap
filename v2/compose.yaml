services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_DB: skillswap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d skillswap"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://skillswap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/skillswap
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      STARTER_MINUTES: ${STARTER_MINUTES:-120}
      REPUTATION_HALF_LIFE_DAYS: ${REPUTATION_HALF_LIFE_DAYS:-90}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
